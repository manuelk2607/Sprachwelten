name: Checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run lint
      - run: npm run check:translations
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SPRACHWELTEN_OFFLINE_PREVIEW: '1'
      - name: Package and smoke-test the isolated Worlds Worker
        run: |
          npm run deploy:worlds-pilot -- --dry-run > "$RUNNER_TEMP/worlds-pilot-package.log" 2>&1 || { tail -60 "$RUNNER_TEMP/worlds-pilot-package.log"; exit 1; }
          node scripts/test-worlds-pilot-worker.mts
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run test:worlds-browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
