name: Isolated integration
on:
  workflow_dispatch:
    inputs:
      publish_worlds_pilot:
        description: Publish the isolated Sprachwelten Worlds test worker
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: isolated-qa
  cancel-in-progress: false
jobs:
  integration:
    if: vars.NEON_QA_ENABLED == 'true'
    environment: qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify the isolated Worker package before provisioning
        if: github.event_name == 'workflow_dispatch' && inputs.publish_worlds_pilot
        env:
          SPRACHWELTEN_OFFLINE_PREVIEW: '1'
        run: |
          npm run build
          npm run deploy:worlds-pilot -- --dry-run > "$RUNNER_TEMP/worlds-pilot-package.log" 2>&1 || { tail -60 "$RUNNER_TEMP/worlds-pilot-package.log"; exit 1; }
          node scripts/test-worlds-pilot-worker.mts
      - name: Require a separate QA project and empty template
        env:
          QA_PROJECT: ${{ vars.NEON_QA_PROJECT_ID }}
          QA_TEMPLATE: ${{ vars.NEON_QA_TEMPLATE_BRANCH }}
          PUBLISH_WORLDS_PILOT: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_worlds_pilot }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict";import{appendFileSync}from"node:fs";assert.ok(process.env.QA_PROJECT&&process.env.QA_PROJECT!=="calm-tooth-60944868");assert.match(process.env.QA_TEMPLATE??"",/^br-[a-z0-9-]+$/);const hours=process.env.PUBLISH_WORLDS_PILOT==="true"?24:1;appendFileSync(process.env.GITHUB_ENV,"QA_EXPIRES_AT="+new Date(Date.now()+hours*3600000).toISOString()+"\n");'
      - name: Create expiring branch from the empty QA template
        id: branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_QA_PROJECT_ID }}
          api_key: ${{ secrets.NEON_QA_API_KEY }}
          parent_branch: ${{ vars.NEON_QA_TEMPLATE_BRANCH }}
          branch_name: qa-${{ github.run_id }}-${{ github.run_attempt }}
          branch_type: default
          database: sprachspiel
          role: neondb_owner
          expires_at: ${{ env.QA_EXPIRES_AT }}
          get_auth_url: true
      - name: Migrations, persistence, permissions and managed Auth
        run: npm run qa:integration -- --migrate-empty --auth
        env:
          QA_DATABASE_APPROVED: '1'
          TEST_DATABASE_HOST: ${{ steps.branch.outputs.db_host }}
          TEST_NEON_BRANCH: ${{ steps.branch.outputs.branch_id }}
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
          DATABASE_URL_UNPOOLED: ${{ steps.branch.outputs.db_url }}
          NEON_AUTH_BASE_URL: ${{ steps.branch.outputs.auth_url }}
      - name: Real managed application HTTP integration on isolated loopback server
        run: node --import tsx scripts/test-qa-http-integration.mts
        env:
          QA_DATABASE_APPROVED: '1'
          TEST_DATABASE_HOST: ${{ steps.branch.outputs.db_host }}
          TEST_NEON_BRANCH: ${{ steps.branch.outputs.branch_id }}
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
          DATABASE_URL_UNPOOLED: ${{ steps.branch.outputs.db_url }}
          NEON_AUTH_BASE_URL: ${{ steps.branch.outputs.auth_url }}
      - name: Allow the public test origin only on the disposable Auth branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_worlds_pilot
        env:
          QA_PROJECT: ${{ vars.NEON_QA_PROJECT_ID }}
          NEON_QA_API_KEY: ${{ secrets.NEON_QA_API_KEY }}
          QA_DATABASE_APPROVED: '1'
          TEST_DATABASE_HOST: ${{ steps.branch.outputs.db_host }}
          TEST_NEON_BRANCH: ${{ steps.branch.outputs.branch_id }}
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
          NEON_AUTH_BASE_URL: ${{ steps.branch.outputs.auth_url }}
        run: node scripts/configure-worlds-pilot-auth.mts
      - name: Publish to the dedicated Worlds test worker
        if: github.event_name == 'workflow_dispatch' && inputs.publish_worlds_pilot
        env:
          QA_DATABASE_APPROVED: '1'
          TEST_DATABASE_HOST: ${{ steps.branch.outputs.db_host }}
          TEST_NEON_BRANCH: ${{ steps.branch.outputs.branch_id }}
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
          NEON_AUTH_BASE_URL: ${{ steps.branch.outputs.auth_url }}
          WORLDS_PILOT_CLIENT_ID: ${{ vars.WORLDS_PILOT_CLIENT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.WORLDS_PILOT_CLOUDFLARE_ACCOUNT_ID }}
          WORLDS_PILOT_CLOUDFLARE_TOKEN: ${{ secrets.WORLDS_PILOT_CLOUDFLARE_TOKEN }}
        run: |
          export NEON_AUTH_COOKIE_SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$NEON_AUTH_COOKIE_SECRET"
          npm run deploy:worlds-pilot -- --deploy
      - name: Check the published test address
        if: github.event_name == 'workflow_dispatch' && inputs.publish_worlds_pilot
        run: node scripts/test-worlds-pilot-live.mts
